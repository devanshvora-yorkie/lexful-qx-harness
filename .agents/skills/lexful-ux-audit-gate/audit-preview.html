<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UX audit — __TARGET__</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --paper: #f5f5f4;
      --card: #ffffff;
      --s0: #9f1239;
      --s1: #c2410c;
      --s2: #b45309;
      --s3: #4d7c0f;
      --so: #44403c;
      --pass: #3f6212;
      --advisory: #b45309;
      --blocking: #9f1239;
      --gauge: #44403c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.5 "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }
    .topnav {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      align-items: baseline;
      justify-content: space-between;
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 700; letter-spacing: -0.02em; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 13px; }
    .meta strong { color: var(--ink); font-weight: 650; }
    .layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 880px);
      gap: 28px;
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0 64px;
    }
    aside { position: sticky; top: 72px; align-self: start; }
    .aside-label {
      margin: 18px 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .filters button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .filters button.is-on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .index { display: flex; flex-direction: column; gap: 6px; }
    .index a {
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      line-height: 1.35;
      padding: 8px 10px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .index a:hover { border-color: #d6d3d1; }
    .health {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 24px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }
    .gauge-wrap { text-align: center; }
    .gauge-caption {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .gauge {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--gauge) calc(var(--score) * 1%), #e7e5e4 0);
    }
    .gauge span {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--card);
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 700;
    }
    .health-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .verdict {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .verdict-pass { background: #ecfccb; color: var(--pass); }
    .verdict-advisory-fail { background: #fef3c7; color: var(--advisory); }
    .verdict-blocking-fail { background: #ffe4e6; color: var(--blocking); }
    .kicker { color: var(--muted); font-size: 13px; margin: 10px 0 0; max-width: 62ch; }
    .counts { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 14px 0 0; }
    .counts li {
      background: var(--paper);
      border-radius: 10px;
      padding: 8px 12px;
      flex: 1 1 64px;
      border-top: 3px solid var(--so);
    }
    .counts .count-S0 { border-top-color: var(--s0); }
    .counts .count-S1 { border-top-color: var(--s1); }
    .counts .count-S2 { border-top-color: var(--s2); }
    .counts .count-S3 { border-top-color: var(--s3); }
    .counts span { display: block; color: var(--muted); font-size: 12px; }
    .counts strong { font-size: 20px; }
    .finding-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 6px solid var(--so);
      border-radius: 16px;
      padding: 18px 20px 8px;
      margin: 16px 0;
    }
    .finding-card[hidden] { display: none; }
    .severity-S0 { border-left-color: var(--s0); }
    .severity-S1 { border-left-color: var(--s1); }
    .severity-S2 { border-left-color: var(--s2); }
    .severity-S3 { border-left-color: var(--s3); }
    .severity-O { border-left-color: var(--so); }
    .finding-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .finding-title { font-size: 20px; line-height: 1.3; margin: 10px 0 14px; letter-spacing: -0.02em; }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      padding: 2px 8px;
      color: #fff;
      background: var(--so);
    }
    .severity-S0 .badge { background: var(--s0); }
    .severity-S1 .badge { background: var(--s1); }
    .severity-S2 .badge { background: var(--s2); }
    .severity-S3 .badge { background: var(--s3); }
    .card-kicker { color: var(--muted); font-size: 13px; }
    .section-box {
      background: var(--paper);
      border-radius: 12px;
      padding: 12px 14px 4px;
      margin: 0 0 12px;
    }
    .section-box.plan { background: #f4f7fb; }
    .section-box h3 {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .section-box-content { margin: 0; }
    .section-box-content p { margin: 0 0 8px; max-width: 72ch; }
    .plan-extra { margin: 4px 0 10px; }
    .plan-extra div { margin: 0 0 8px; max-width: 72ch; }
    .plan-extra dt { font-size: 12px; font-weight: 700; color: var(--muted); }
    .plan-extra dd { margin: 2px 0 0; }
    .observations-section { margin-top: 36px; }
    .observations-section > h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: -0.02em; }
    .observations-section > p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
    .notes { margin-top: 28px; color: var(--muted); font-size: 13px; }
    .notes summary { cursor: pointer; font-weight: 650; color: var(--ink); }
    .empty { color: var(--muted); }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; width: min(880px, calc(100% - 28px)); }
      aside { position: static; }
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">Lexful UX audit</div>
    <div class="meta">
      <span>Date <strong>__DATE__</strong></span>
      <span>Run ID <strong>__RUN_ID__</strong></span>
      <span>Target <strong>__TARGET__</strong></span>
    </div>
  </nav>
  <div class="layout">
    <aside>
      <p class="aside-label">Severity</p>
      <div class="filters">
        <button type="button" data-filter="all" class="is-on">All</button>
        <button type="button" data-filter="S0">S0</button>
        <button type="button" data-filter="S1">S1</button>
        <button type="button" data-filter="S2">S2</button>
        <button type="button" data-filter="S3">S3</button>
        <button type="button" data-filter="O">O</button>
      </div>
      <p class="aside-label">Defects</p>
      <nav class="index" data-index="defects">__DEFECT_INDEX__</nav>
      <p class="aside-label">Observations</p>
      <nav class="index" data-index="observations">__OBSERVATION_INDEX__</nav>
    </aside>
    <main>
      <section class="health">
        <div class="gauge-wrap">
          <div class="gauge" style="--score: __SCORE__; --gauge: __GAUGE__" aria-label="Visual Score Gauge"><span>__SCORE__</span></div>
          <p class="gauge-caption">Visual Score Gauge</p>
        </div>
        <div>
          <p class="health-label">UX Health Verdict</p>
          <div class="verdict verdict-__VERDICT_CLASS__">__VERDICT__</div>
          <p class="kicker">__KICKER__</p>
          <ul class="counts">__COUNTS__</ul>
        </div>
      </section>
      <div id="findings">__DEFECTS__</div>
      __OBSERVATIONS__
      __NOTES__
    </main>
  </div>
  <script>
    const buttons = document.querySelectorAll("[data-filter]");
    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const severity = button.getAttribute("data-filter");
        buttons.forEach((item) => item.classList.toggle("is-on", item === button));
        document.querySelectorAll(".finding-card").forEach((card) => {
          card.hidden = severity !== "all" && !card.classList.contains("severity-" + severity);
        });
        document.querySelectorAll(".index a").forEach((link) => {
          const card = document.getElementById(link.getAttribute("href").slice(1));
          link.hidden = !card || card.hidden;
        });
        document.querySelectorAll(".observations-section").forEach((section) => {
          const cards = section.querySelectorAll(".finding-card");
          section.hidden = [...cards].every((card) => card.hidden);
        });
      });
    });
  </script>
</body>
</html>
