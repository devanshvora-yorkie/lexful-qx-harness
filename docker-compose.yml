# After clone: copy .env.example to .env, fill the keys, then `docker compose up --build`.
services:
  harness:
    build: .
    image: lexful-qx-harness:local
    ports:
      - "${QA_SERVER_PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      QA_SERVER_PORT: "8787"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CI: "1"
    volumes:
      - ./.env:/opt/lexful-qa-opencode/.env:ro
      - harness-runs:/opt/lexful-qa-opencode/runs
    shm_size: "2gb"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  harness-runs:
