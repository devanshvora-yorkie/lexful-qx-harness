# After clone: copy .env.example to .env, fill the keys, then `docker compose up --build`.
services:
  harness:
    build: .
    image: lexful-qx-harness:local
    ports:
      - "127.0.0.1:${QA_SERVER_PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      QA_SERVER_PORT: "8787"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CI: "1"
      AWS_REGION: us-east-1
      # OpenCode reads the bearer token. .env stores it as BEDROCK_API_KEY.
      AWS_BEARER_TOKEN_BEDROCK: ${BEDROCK_API_KEY:-}
      # E2E User Journey TCs. Set QA_PHASE1_ON_START=false in .env to skip them on startup.
      QA_PHASE1_ON_START: ${QA_PHASE1_ON_START:-true}
      # UI/UX audit. Set QA_RUN_UX_AUDIT=false to run functional QA only.
      QA_RUN_UX_AUDIT: ${QA_RUN_UX_AUDIT:-true}
      QA_UX_BEFORE_AFTER: ${QA_UX_BEFORE_AFTER:-false}
      QA_UX_MODE: ${QA_UX_MODE:-simple}
    volumes:
      - ./opencode.jsonc:/opt/lexful-qa-opencode/opencode.jsonc:ro
      - ./scripts:/opt/lexful-qa-opencode/scripts:ro
      - ./server/app:/opt/lexful-qa-opencode/server/app:ro
      - ./.agents:/opt/lexful-qa-opencode/.agents:ro
      - ./playwright.config.ts:/opt/lexful-qa-opencode/playwright.config.ts:ro
      - ./auth-helper.ts:/opt/lexful-qa-opencode/auth-helper.ts:ro
      # Read-write so a locator heal is written back to this folder. The space stays inside the quotes.
      - "./e2e test cases:/opt/lexful-qa-opencode/e2e test cases"
      - ./runs:/opt/lexful-qa-opencode/runs
    shm_size: "2gb"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
